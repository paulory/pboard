name: Build macOS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Ad-hoc sign and build DMG
        run: |
          ART=build/PBoard_artefacts/Release
          for b in "$ART/Standalone/pboard.app" "$ART/VST3/pboard.vst3" "$ART/AU/pboard.component"; do
            codesign --force --deep --sign - "$b"
          done

          STAGE=dmg-stage
          mkdir -p "$STAGE/Plug-Ins"
          ditto "$ART/Standalone/pboard.app" "$STAGE/pboard.app"
          ditto "$ART/VST3/pboard.vst3" "$STAGE/Plug-Ins/pboard.vst3"
          ditto "$ART/AU/pboard.component" "$STAGE/Plug-Ins/pboard.component"
          cp "packaging/Install Plugins.command" "$STAGE/"
          chmod +x "$STAGE/Install Plugins.command"
          cp README.md "$STAGE/README.md"
          ln -s /Applications "$STAGE/Applications"

          VERSION=$(grep -m1 -E "project\(PBoard VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          hdiutil create -volname "pboard $VERSION" -srcfolder "$STAGE" -ov -format UDZO "pboard-$VERSION.dmg"
          hdiutil verify "pboard-$VERSION.dmg"
          echo "DMG_FILE=pboard-$VERSION.dmg" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pboard-macos-dmg
          path: ${{ env.DMG_FILE }}

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_FILE }}
